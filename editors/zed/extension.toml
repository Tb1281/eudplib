id = "eudkit-lsp"
name = "EUDKIT LSP"
version = "0.1.1"
schema_version = 1
authors = ["Armoha <kein0011@naver.com>"]
description = "Canonical StarCraft unit-name completion for EUD Python, TypeScript, TSX, and JavaScript via the shared eudkit-lsp server."
repository = "https://github.com/Tb1281/eudplib"

[language_servers.eudkit-lsp]
name = "eudkit-lsp"
languages = ["Python", "TypeScript", "TSX", "JavaScript"]

# These are the language ids understood by the shared eudkit-lsp server
# (src/rust/eudkit-lsp/src/server.rs and analysis/ts.rs).
[language_servers.eudkit-lsp.language_ids]
Python = "python"
TypeScript = "typescript"
TSX = "typescriptreact"
JavaScript = "javascript"
