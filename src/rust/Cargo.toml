[workspace.package]
version = "0.1.1"
authors = ["Armoha <kein0011@naver.com>"]
edition = "2021"
publish = false
# This specifies the MSRV. oxc_parser 0.156 requires Rust 1.97.
rust-version = "1.97.0"

[package]
name = "eudkit-rust"
version.workspace = true
authors.workspace = true
edition.workspace = true
publish.workspace = true
rust-version.workspace = true

[dependencies]
pyo3 = { version = "0.29", features = ["abi3", "abi3t"] }
eudkit-core = { path = "eudkit-core" }

[features]
# See https://github.com/PyO3/pyo3/issues/340
extension-module = ["pyo3/extension-module"]
default = ["extension-module"]

[lib]
name = "eudkit_rust"
crate-type = ["cdylib"]

[profile.release]
overflow-checks = false
strip = true

[workspace]
members = [
    "eudplib-stormlib",
    "eudkit-core",
    "eudkit-cli",
    "eudkit-lsp",
    "eudkit-ts",
]
