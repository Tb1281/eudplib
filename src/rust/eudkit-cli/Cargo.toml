[package]
name = "eudkit-cli"
version.workspace = true
authors.workspace = true
edition.workspace = true
publish.workspace = true
rust-version.workspace = true

[lib]
name = "eudkit_cli"
path = "src/lib.rs"

[[bin]]
name = "eudkit"
path = "src/main.rs"

[dependencies]
eudkit-core = { path = "../eudkit-core" }
eudkit-ts = { path = "../eudkit-ts" }

[dev-dependencies]
eudplib-stormlib = { path = "../eudplib-stormlib", default-features = false }
tempfile = "3"
