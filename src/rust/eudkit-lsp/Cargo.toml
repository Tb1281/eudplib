[package]
name = "eudkit-lsp"
version.workspace = true
authors.workspace = true
edition.workspace = true
publish.workspace = true
rust-version.workspace = true

[lib]
name = "eudkit_lsp"
path = "src/lib.rs"

[[bin]]
name = "eudkit-lsp"
path = "src/main.rs"

[dependencies]
eudkit-core = { path = "../eudkit-core" }
lsp-server = "0.10"
lsp-types = "0.97"
oxc_allocator = "0.156.0"
oxc_diagnostics = "0.156.0"
oxc_parser = "0.156.0"
oxc_span = "0.156.0"
ruff_python_ast = "0.0.20"
ruff_python_parser = "0.0.20"
ruff_text_size = "0.0.20"
serde_json = "1"
