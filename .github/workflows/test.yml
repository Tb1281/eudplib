name: Test

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  unittest:
    name: Unittest (${{ matrix.os }}, ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      CMAKE_GENERATOR: Ninja
    continue-on-error: ${{ matrix.experimental || false }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            python-version: "3.10"
          - os: windows-latest
            python-version: "3.11"
          - os: windows-latest
            python-version: "3.12"
          - os: windows-latest
            python-version: "3.13"
          - os: windows-latest
            python-version: "3.14"
          # PyO3 supports the free-threaded build of CPython 3.14+ only.
          # (see MIN_FREE_THREADED_VERSION in pyo3-ffi's build script)
          - os: windows-latest
            python-version: "3.14t"
            experimental: true
          - os: ubuntu-latest
            python-version: "3.12"
          - os: ubuntu-latest
            python-version: "3.14"
          - os: macos-latest
            python-version: "3.12"
          - os: macos-latest
            python-version: "3.14"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: recursive
      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build zlib1g-dev libbz2-dev
      - name: Install Ninja (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true
          cache: pip
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run unit test
        run: |
          pip install .
          cd tests
          python test_unittest.py
          cd ..

  rust:
    name: Rust (fmt, clippy, test)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src/rust
      - name: Install Rust test dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build python3-dev
      - name: Format check
        working-directory: src/rust
        run: cargo fmt --all -- --check
      - name: Clippy
        working-directory: src/rust
        run: cargo clippy --workspace --all-targets
      - name: Test
        working-directory: src/rust
        run: cargo test --workspace
      - name: MSRV check
        working-directory: src/rust
        run: |
          rustup toolchain install 1.97.0 --profile minimal
          cargo +1.97.0 check --workspace --all-targets

  mypy:
    name: mypy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install mypy
        run: pip install --upgrade mypy typing_extensions
      - name: Run mypy for Python 3.10 (min)
        run: mypy src/eudplib --python-version 3.10
      - name: Run mypy for Python 3.14 (max)
        run: mypy src/eudplib --python-version 3.14

  pyright:
    name: Pyright
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CMAKE_GENERATOR: Ninja
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: recursive
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y ninja-build zlib1g-dev libbz2-dev
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build wheel
        run: python -m pip wheel . --no-deps --wheel-dir dist
      - name: Verify py.typed is packaged
        run: |
          python - <<'PY'
          import pathlib
          import zipfile

          wheel = next(pathlib.Path("dist").glob("*.whl"))
          with zipfile.ZipFile(wheel) as archive:
              names = archive.namelist()
          assert "eudkit/py.typed" in names, f"eudkit/py.typed missing from {wheel}"
          print(f"{wheel.name} contains eudkit/py.typed")
          PY
      - name: Install wheel and Pyright
        run: |
          python -m pip install --upgrade pip
          python -m pip install dist/*.whl pyright
      - name: Type-check consumer fixture
        # Run outside the repository so Pyright resolves the installed wheel
        # rather than adding the local src directory as an extra path.
        working-directory: ${{ runner.temp }}
        run: pyright --pythonpath "$(python -c 'import sys; print(sys.executable)')" "$GITHUB_WORKSPACE/tests/typing"

  typos:
    name: Typos
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: crate-ci/typos@v1
        with:
          config: ./.typos.toml

  ruff:
    name: Ruff
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/ruff-action@v3
        with:
          src: "./src/eudplib"
