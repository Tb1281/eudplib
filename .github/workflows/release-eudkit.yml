name: Release eudkit

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name for release (e.g. v0.2.0)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary_name: eudkit
            archive_name: eudkit-linux-x86_64.tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary_name: eudkit.exe
            archive_name: eudkit-windows-x86_64.zip
          - os: macos-latest
            target: aarch64-apple-darwin
            binary_name: eudkit
            archive_name: eudkit-macos-aarch64.tar.gz
          - os: macos-latest
            target: x86_64-apple-darwin
            binary_name: eudkit
            archive_name: eudkit-macos-x86_64.tar.gz

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y zlib1g-dev libbz2-dev

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build eudkit binary
        run: |
          cargo build --release --manifest-path src/rust/Cargo.toml -p eudkit-cli --bin eudkit --target ${{ matrix.target }}

      - name: Package archive (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          BIN_PATH="src/rust/target/${{ matrix.target }}/release/${{ matrix.binary_name }}"
          chmod +x "$BIN_PATH"
          mkdir -p dist
          cp "$BIN_PATH" dist/
          tar -czf "${{ matrix.archive_name }}" -C dist "${{ matrix.binary_name }}"
          sha256sum "${{ matrix.archive_name }}" > "${{ matrix.archive_name }}.sha256"

      - name: Package archive (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $binPath = "src/rust/target/${{ matrix.target }}/release/${{ matrix.binary_name }}"
          mkdir dist
          Copy-Item $binPath -Destination "dist/${{ matrix.binary_name }}"
          Compress-Archive -Path "dist/${{ matrix.binary_name }}" -DestinationPath "${{ matrix.archive_name }}"
          $hash = (Get-FileHash -Algorithm SHA256 "${{ matrix.archive_name }}").Hash.ToLower()
          "$hash  ${{ matrix.archive_name }}" | Out-File -Encoding ascii "${{ matrix.archive_name }}.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive_name }}
          path: |
            ${{ matrix.archive_name }}
            ${{ matrix.archive_name }}.sha256
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.tag_name != ''
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Display downloaded artifacts
        run: ls -la release-assets

      - name: Determine tag name
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.tag_name }}" ]; then
            echo "name=${{ github.event.inputs.tag_name }}" >> $GITHUB_OUTPUT
          else
            echo "name=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          fi

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ steps.tag.outputs.name }}
          files: |
            release-assets/*
          generate_release_notes: true
          draft: false
          prerelease: false
