name: Release eudkit

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name for release (e.g. v0.2.0)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    env:
      CMAKE_GENERATOR: Ninja
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary_name: eudkit
            raw_binary_name: eudkit-linux-x86_64
            archive_name: eudkit-linux-x86_64.tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary_name: eudkit.exe
            raw_binary_name: eudkit-windows-x86_64.exe
            archive_name: eudkit-windows-x86_64.zip
          - os: macos-latest
            target: aarch64-apple-darwin
            binary_name: eudkit
            raw_binary_name: eudkit-macos-aarch64
            archive_name: eudkit-macos-aarch64.tar.gz
          - os: macos-latest
            target: x86_64-apple-darwin
            binary_name: eudkit
            raw_binary_name: eudkit-macos-x86_64
            archive_name: eudkit-macos-x86_64.tar.gz

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build zlib1g-dev libbz2-dev

      - name: Install Ninja (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build eudkit binary
        run: |
          cargo build --release --manifest-path src/rust/Cargo.toml -p eudkit-cli --bin eudkit --target ${{ matrix.target }}

      - name: Package artifacts (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          BIN_PATH="src/rust/target/${{ matrix.target }}/release/${{ matrix.binary_name }}"
          chmod +x "$BIN_PATH"
          mkdir -p dist to-release
          cp "$BIN_PATH" dist/
          tar -czf "to-release/${{ matrix.archive_name }}" -C dist "${{ matrix.binary_name }}"
          cp "$BIN_PATH" "to-release/${{ matrix.raw_binary_name }}"
          (cd to-release && sha256sum "${{ matrix.archive_name }}" > "${{ matrix.archive_name }}.sha256")
          (cd to-release && sha256sum "${{ matrix.raw_binary_name }}" > "${{ matrix.raw_binary_name }}.sha256")

      - name: Package artifacts (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $binPath = "src/rust/target/${{ matrix.target }}/release/${{ matrix.binary_name }}"
          New-Item -ItemType Directory -Force -Path "dist", "to-release"
          Copy-Item $binPath -Destination "dist/${{ matrix.binary_name }}"
          Compress-Archive -Path "dist/${{ matrix.binary_name }}" -DestinationPath "to-release/${{ matrix.archive_name }}"
          Copy-Item $binPath -Destination "to-release/${{ matrix.raw_binary_name }}"
          Copy-Item $binPath -Destination "to-release/eudkit.exe"

          Push-Location to-release
          $hArchive = (Get-FileHash -Algorithm SHA256 "${{ matrix.archive_name }}").Hash.ToLower()
          "$hArchive  ${{ matrix.archive_name }}" | Out-File -Encoding ascii "${{ matrix.archive_name }}.sha256"

          $hRaw = (Get-FileHash -Algorithm SHA256 "${{ matrix.raw_binary_name }}").Hash.ToLower()
          "$hRaw  ${{ matrix.raw_binary_name }}" | Out-File -Encoding ascii "${{ matrix.raw_binary_name }}.sha256"

          $hExe = (Get-FileHash -Algorithm SHA256 "eudkit.exe").Hash.ToLower()
          "$hExe  eudkit.exe" | Out-File -Encoding ascii "eudkit.exe.sha256"
          Pop-Location

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.raw_binary_name }}
          path: to-release/*
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.tag_name != ''
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Display downloaded artifacts
        run: ls -la release-assets

      - name: Determine tag name
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.tag_name }}" ]; then
            echo "name=${{ github.event.inputs.tag_name }}" >> $GITHUB_OUTPUT
          else
            echo "name=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          fi

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ steps.tag.outputs.name }}
          files: |
            release-assets/*
          generate_release_notes: true
          draft: false
          prerelease: false
